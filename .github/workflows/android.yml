name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shelf.p12"
            export KEYSTORE_PATH="$RUNNER_TEMP/shelf.p12"
          else
            echo "::warning::No signing key secret found, using a throwaway debug key"
          fi
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/anime-shelf.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: anime-shelf-apk
          path: ${{ runner.temp }}/anime-shelf.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-1.0.${{ github.run_number }}" "$RUNNER_TEMP/anime-shelf.apk" \
            --title "Anime Shelf for Android 1.0.${{ github.run_number }}" \
            --notes "Install anime-shelf.apk on an Android phone (Android 10 or newer). The app opens the live shelf full screen, so it updates whenever the website does." \
            --latest

      - name: Update the APK the website serves
        run: |
          mkdir -p download
          cp "$RUNNER_TEMP/anime-shelf.apk" download/anime-shelf.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add download/anime-shelf.apk
          git diff --cached --quiet || git commit -m "Update Android app to 1.0.${{ github.run_number }}"
          git pull --rebase origin main && git push origin HEAD:main
